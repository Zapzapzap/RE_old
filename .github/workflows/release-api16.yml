name: Build Release API 16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-api16.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Keystore & Patch Gradle, App.kt, and Manifest for API 16
        run: |
          set -e
          keytool -genkey -v -keystore app/release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass android123 -keypass android123 -dname "CN=Local,O=Dev,C=US"

          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/minSdk\s*=\s*"[0-9]\+"/minSdk = "16"/g' gradle/libs.versions.toml
          fi
          sed -i 's/minSdk\s*=\s*[0-9]\+/minSdk = 16/g' app/build.gradle.kts

          # Find actual Application class path dynamically
          APP_KT=$(find app/src/main -name "App.kt" -o -name "App.java" | head -n 1)
          echo "Found Application file: $APP_KT"

          cat << 'EOF' > app/maindexlist.txt
          com/pedro/streamer/App.class
          androidx/multidex/MultiDexApplication.class
          androidx/multidex/MultiDex.class
          androidx/multidex/MultiDex$V14.class
          androidx/multidex/MultiDex$V19.class
          androidx/multidex/MultiDex$V4.class
          androidx/multidex/MultiDexExtractor.class
          androidx/multidex/MultiDexExtractor$ExtractedDex.class
          androidx/multidex/ZipUtil.class
          androidx/multidex/ZipUtil$CentralDirectory.class
          EOF

          python3 -c '
          import re

          with open("app/build.gradle.kts", "r") as f:
              gradle = f.read()

          if "androidx.multidex:multidex" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation(\"androidx.multidex:multidex:2.0.1\")")

          # Let Gradle handle zipalign + v1/v2 signing natively
          gradle += """

          android {
              defaultConfig {
                  minSdk = 16
                  multiDexEnabled = true
                  multiDexKeepFile = file("maindexlist.txt")
              }
              signingConfigs {
                  create("api16Release") {
                      storeFile = file("release.jks")
                      storePassword = "android123"
                      keyAlias = "mykey"
                      keyPassword = "android123"
                      enableV1Signing = true
                      enableV2Signing = true
                  }
              }
              buildTypes {
                  getByName("release") {
                      isDebuggable = false
                      isMinifyEnabled = false
                      isShrinkResources = false
                      signingConfig = signingConfigs.getByName("api16Release")
                  }
              }
          }
          """

          with open("app/build.gradle.kts", "w") as f:
              f.write(gradle)

          app_kt = "app/src/main/java/com/pedro/streamer/App.kt"
          with open(app_kt, "r") as f:
              lines = f.readlines()

          new_lines = []
          for line in lines:
              if line.lstrip().startswith("import "):
                  new_lines.append(line)
              elif "Application()" in line:
                  new_lines.append(re.sub(r":\s*(?:android\.app\.)?Application\(\)", ": androidx.multidex.MultiDexApplication()", line))
              elif "GlUtil." in line:
                  indent = line[:len(line) - len(line.lstrip())]
                  new_lines.append(f"{indent}try {{ {line.strip()} }} catch (t: Throwable) {{ t.printStackTrace() }}\n")
              else:
                  new_lines.append(line)

          with open(app_kt, "w") as f:
              f.writelines(new_lines)

          manifest_path = "app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              text = f.read()

          libs = "androidx.security, com.google.android.material, androidx.constraintlayout, androidx.appcompat, androidx.core, androidx.activity, androidx.fragment, androidx.lifecycle.runtime, androidx.savedstate"

          if "xmlns:tools=" not in text:
              text = re.sub(r"<manifest\b", "<manifest xmlns:tools=\"http://android.com\"", text, count=1)

          if "<uses-sdk" in text:
              if "tools:overrideLibrary=" in text:
                  text = re.sub(r"tools:overrideLibrary=\"([^\"]*)\"", lambda m: f"tools:overrideLibrary=\"{m.group(1)}, {libs}\"", text, count=1)
              else:
                  text = re.sub(r"<uses-sdk\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\"", text, count=1)
          else:
              text = re.sub(r"<application\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\" />\n    <application", text, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(text)
          '

      - name: Build Signed Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Verify APK & Prepare Artifact
        run: |
          set -x
          SIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          cp "$SIGNED_APK" rootencoder-api16-release.apk
          unzip -l rootencoder-api16-release.apk | grep '\.dex' || true
          unzip -p rootencoder-api16-release.apk classes.dex | grep -a -o "Lcom/pedro/streamer/App;" || true

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rootencoder-api16-release
          path: rootencoder-api16-release.apk
