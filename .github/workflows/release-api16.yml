name: Build Release API 16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-api16.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch Gradle, Multidex, and Manifest for API 16
        run: |
          sed -i 's/minSdk = [0-9]\+/minSdk = 16/g' app/build.gradle.kts
          python3 -c '
          import re

          # 1. Append explicit overrides to app/build.gradle.kts so nothing earlier can re-enable R8
          with open("app/build.gradle.kts", "r") as f:
              gradle = f.read()

          if "androidx.multidex:multidex" not in gradle:
              gradle = gradle.replace("dependencies {", "dependencies {\n    implementation(\"androidx.multidex:multidex:2.0.1\")")

          gradle += """

          android {
              defaultConfig {
                  minSdk = 16
                  multiDexEnabled = true
              }
              buildTypes {
                  getByName("release") {
                      isMinifyEnabled = false
                      isShrinkResources = false
                      isDebuggable = false
                  }
              }
          }
          """

          with open("app/build.gradle.kts", "w") as f:
              f.write(gradle)

          # 2. Keep all RootEncoder classes in ProGuard just in case
          with open("app/proguard-rules.pro", "a") as f:
              f.write("\n-keep class com.pedro.** { *; }\n-dontwarn com.pedro.**\n")

          # 3. Patch App.kt to extend MultiDexApplication()
          app_kt = "app/src/main/java/com/pedro/streamer/App.kt"
          with open(app_kt, "r") as f:
              kt = f.read()

          if "MultiDexApplication" not in kt:
              kt = kt.replace("import android.app.Application", "import androidx.multidex.MultiDexApplication")
              kt = kt.replace(": Application()", ": MultiDexApplication()")

          with open(app_kt, "w") as f:
              f.write(kt)

          # 4. Patch AndroidManifest.xml overrideLibrary
          manifest_path = "app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              text = f.read()

          libs = "androidx.security, com.google.android.material, androidx.constraintlayout, androidx.appcompat, androidx.core, androidx.activity, androidx.fragment, androidx.lifecycle.runtime, androidx.savedstate"

          if "xmlns:tools=" not in text:
              text = re.sub(r"<manifest\b", "<manifest xmlns:tools=\"http://android.com\"", text, count=1)

          if "<uses-sdk" in text:
              if "tools:overrideLibrary=" in text:
                  text = re.sub(r"tools:overrideLibrary=\"([^\"]*)\"", lambda m: f"tools:overrideLibrary=\"{m.group(1)}, {libs}\"", text, count=1)
              else:
                  text = re.sub(r"<uses-sdk\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\"", text, count=1)
          else:
              text = re.sub(r"<application\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\" />\n    <application", text, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(text)
          '

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Zipalign and Sign APK (v1 + v2 for API 16)
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass android123 -keypass android123 -dname "CN=Local,O=Dev,C=US"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --out rootencoder-api16-release.apk aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rootencoder-api16-release
          path: rootencoder-api16-release.apk
