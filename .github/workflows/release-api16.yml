name: Build Release API 16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-api16.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch app/build.gradle.kts and AndroidManifest for API 16
        run: |
          sed -i 's/minSdk = [0-9]\+/minSdk = 16/g' app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts
          grep -q 'xmlns:tools=' app/src/main/AndroidManifest.xml || sed -i 's|<manifest |<manifest xmlns:tools="http://android.com" |' app/src/main/AndroidManifest.xml
          if grep -q '<uses-sdk' app/src/main/AndroidManifest.xml; then
            sed -i 's|<uses-sdk|<uses-sdk tools:overrideLibrary="androidx.security, com.google.android.material, androidx.constraintlayout, androidx.appcompat, androidx.core, androidx.activity, androidx.fragment, androidx.lifecycle.runtime, androidx.savedstate"|' app/src/main/AndroidManifest.xml
          else
            sed -i 's|<application|<uses-sdk tools:overrideLibrary="androidx.security, com.google.android.material, androidx.constraintlayout, androidx.appcompat, androidx.core, androidx.activity, androidx.fragment, androidx.lifecycle.runtime, androidx.savedstate" />\n    <application|' app/src/main/AndroidManifest.xml
          fi

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Zipalign and Sign APK (v1 + v2 for API 16)
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass android123 -keypass android123 -dname "CN=Local,O=Dev,C=US"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --out rootencoder-api16-release.apk aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rootencoder-api16-release
          path: rootencoder-api16-release.apk
