name: Build Release API 16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-api16.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch app/build.gradle.kts and AndroidManifest for API 16
        run: |
          sed -i 's/minSdk = [0-9]\+/minSdk = 16/g' app/build.gradle.kts
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/g' app/build.gradle.kts
          sed -i 's/isShrinkResources = true/isShrinkResources = false/g' app/build.gradle.kts
          python3 -c '
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          ET.register_namespace("android", "http://android.com")
          ET.register_namespace("tools", "http://android.com")

          tree = ET.parse(path)
          root = tree.getroot()
          tools_attr = "{http://android.com}overrideLibrary"

          uses_sdk = root.find("uses-sdk")
          if uses_sdk is None:
              uses_sdk = ET.Element("uses-sdk")
              root.insert(0, uses_sdk)

          existing = [x.strip() for x in uses_sdk.get(tools_attr, "").split(",") if x.strip()]
          needed = [
              "androidx.security",
              "com.google.android.material",
              "androidx.constraintlayout",
              "androidx.appcompat",
              "androidx.core",
              "androidx.activity",
              "androidx.fragment",
              "androidx.lifecycle.runtime",
              "androidx.savedstate",
          ]
          merged = list(dict.fromkeys(existing + needed))
          uses_sdk.set(tools_attr, ", ".join(merged))

          tree.write(path, encoding="utf-8", xml_declaration=True)
          '
          head -n 15 app/src/main/AndroidManifest.xml

      - name: Build Unsigned Release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Zipalign and Sign APK (v1 + v2 for API 16)
        run: |
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass android123 -keypass android123 -dname "CN=Local,O=Dev,C=US"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 "$UNSIGNED_APK" aligned.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --out rootencoder-api16-release.apk aligned.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rootencoder-api16-release
          path: rootencoder-api16-release.apk
