name: Build Release API 16 APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/release-api16.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Patch minSdk = 16 and Manifest for Debug-Base Build
        run: |
          if [ -f gradle/libs.versions.toml ]; then
            sed -i 's/minSdk\s*=\s*"[0-9]\+"/minSdk = "16"/g' gradle/libs.versions.toml
          fi
          sed -i 's/minSdk\s*=\s*[0-9]\+/minSdk = 16/g' app/build.gradle.kts
          python3 -c '
          import re

          manifest_path = "app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              text = f.read()

          libs = "androidx.security, com.google.android.material, androidx.constraintlayout, androidx.appcompat, androidx.core, androidx.activity, androidx.fragment, androidx.lifecycle.runtime, androidx.savedstate"

          if "xmlns:tools=" not in text:
              text = re.sub(r"<manifest\b", "<manifest xmlns:tools=\"http://android.com\"", text, count=1)

          if "<uses-sdk" in text:
              if "tools:overrideLibrary=" in text:
                  text = re.sub(r"tools:overrideLibrary=\"([^\"]*)\"", lambda m: f"tools:overrideLibrary=\"{m.group(1)}, {libs}\"", text, count=1)
              else:
                  text = re.sub(r"<uses-sdk\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\"", text, count=1)
          else:
              text = re.sub(r"<application\b", f"<uses-sdk tools:overrideLibrary=\"{libs}\" />\n    <application", text, count=1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(text)
          '

      - name: Build Working API 16 Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Convert to Non-Debuggable Release APK & Sign (v1 + v2)
        run: |
          set -e
          command -v apktool >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y apktool)
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)

          # Decode only AndroidManifest.xml (-s keeps classes.dex and resources untouched)
          apktool d -s -f "$DEBUG_APK" -o unpacked_apk
          sed -i 's/android:debuggable="true"/android:debuggable="false"/g' unpacked_apk/AndroidManifest.xml
          apktool b unpacked_apk -o unsigned_release.apk

          # Zipalign and sign with custom release keystore (v1 + v2 for API 16)
          keytool -genkey -v -keystore release.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass android123 -keypass android123 -dname "CN=Local,O=Dev,C=US"
          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          $BUILD_TOOLS/zipalign -v -p 4 unsigned_release.apk aligned_release.apk
          $BUILD_TOOLS/apksigner sign --ks release.jks --ks-pass pass:android123 --v1-signing-enabled true --v2-signing-enabled true --out rootencoder-api16-release.apk aligned_release.apk

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: rootencoder-api16-release
          path: rootencoder-api16-release.apk
